
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carnet de Recettes - Club Cuisine YouCode</title>
    <meta name="description" content="Découvrez des recettes faciles et délicieuses avec Club Cuisine YouCode. Recherchez, ajoutez et partagez vos recettes préférées.">
    <meta name="robots" content="index, follow">
  <script type="module" crossorigin src="/assets/index-RM8Eswms.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-D4G5JPL_.css">
</head>

<body class="bg-slate-50 text-slate-800">

    <header class="bg-white p-5 border-b">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold text-emerald-700">
                Club Cuisine YouCode
            </h1>

            <a href="#ajouter" class="bg-emerald-600 text-white px-4 py-2 rounded-lg">
                Proposer une recette
            </a>
        </div>
    </header>

    <section class="bg-emerald-950 text-white p-10">
        <div class="max-w-7xl mx-auto">
            <h2 class="text-4xl font-bold">
                Le carnet de recettes de votre club
            </h2>

            <p class="mt-3 mb-6">
                Découvrez et partagez vos recettes préférées.
            </p>

            <input
                id="search"
                type="search"
                placeholder="Rechercher une recette..."
                class="w-full p-3 rounded-lg text-slate-800"
            >
        </div>
    </section>

    <main class="max-w-7xl mx-auto p-5 grid lg:grid-cols-3 gap-8">

        <section class="lg:col-span-2">
            <h2 class="text-2xl font-bold mb-5">
                Toutes les recettes
            </h2>

            <p id="recipe-count" class="text-slate-500 mb-3"></p>

            <p id="loading" class="text-emerald-700 text-center hidden">
                Chargement des recettes...
            </p>

            <div id="error-message" class="text-center p-4 hidden">
                <p id="error-text" class="text-red-600"></p>

                <button
                    id="retry-btn"
                    type="button"
                    class="bg-red-600 text-white px-4 py-2 rounded-lg mt-3"
                >
                    Réessayer
                </button>
            </div>

            <div id="recipes" class="grid sm:grid-cols-2 gap-5"></div>
        </section>

        <aside id="ajouter" class="bg-white p-5 rounded-xl shadow">
            <h2 class="text-xl font-bold mb-2">
                Proposer une recette
            </h2>

            <p class="text-sm text-slate-500 mb-5">
                Partagez votre recette avec le club.
            </p>

            <form id="recipe-form" class="space-y-4">

                <div>
                    <label for="name">Nom</label>
                    <input
                        id="name"
                        type="text"
                        placeholder="Ex. Tajine"
                        class="w-full border p-3 rounded-lg"
                    >
                    <p id="name-error" class="text-red-600 text-sm"></p>
                </div>

                <div>
                    <label for="cuisine">Cuisine</label>
                    <input
                        id="cuisine"
                        type="text"
                        placeholder="Ex. Moroccan"
                        class="w-full border p-3 rounded-lg"
                    >
                    <p id="cuisine-error" class="text-red-600 text-sm"></p>
                </div>

                <div>
                    <label for="difficulty">Difficulté</label>
                    <select id="difficulty" class="w-full border p-3 rounded-lg">
                        <option value="">Choisir</option>
                        <option value="Easy">Facile</option>
                        <option value="Medium">Moyenne</option>
                        <option value="Hard">Difficile</option>
                    </select>
                    <p id="difficulty-error" class="text-red-600 text-sm"></p>
                </div>

                <div>
                    <label for="prepTimeMinutes">Temps (minutes)</label>
                    <input
                        id="prepTimeMinutes"
                        type="number"
                        placeholder="45"
                        class="w-full border p-3 rounded-lg"
                    >
                    <p id="time-error" class="text-red-600 text-sm"></p>
                </div>

                <button
                    id="submit-btn"
                    type="submit"
                    class="w-full bg-emerald-600 text-white p-3 rounded-lg hover:bg-emerald-700"
                >
                    Ajouter la recette
                </button>

                <p id="success-message" class="text-emerald-600 text-sm"></p>

            </form>
        </aside>

    </main>
    <footer class="text-center border-t p-6 text-slate-500">
        Club Cuisine YouCode - API DummyJSON
    </footer>
</body>
</html>
